services:
  # ─── PostgreSQL + pgvector ────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aie_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_engineer}
      POSTGRES_USER: ${POSTGRES_USER:-ai_engineer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_engineer} -d ${POSTGRES_DB:-ai_engineer}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aie_network

  # ─── Backend (FastAPI) ────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aie_backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Override host to use Docker service name
      POSTGRES_HOST: postgres
      WORKSPACE_BASE_DIR: /tmp/ai-engineer-workspaces
    volumes:
      # Mount source for hot-reload in development
      - ./backend:/app
      # Docker socket — needed for sandbox container management in Phase 6
      - /var/run/docker.sock:/var/run/docker.sock
      # Shared workspace volume for sandbox access
      - workspaces:/tmp/ai-engineer-workspaces
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - aie_network

  # ─── Frontend (React/Vite) ────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: aie_frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
      VITE_APP_NAME: ${VITE_APP_NAME:-AI Software Engineer}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - aie_network

  # ─── Sandbox (isolated code execution) ────────────────────────────────────
  # Not started automatically — spawned on-demand by the backend's sandbox.py
  # Build it here so the image is available locally.
  sandbox:
    build:
      context: ./sandbox
      dockerfile: Dockerfile
    image: aie_sandbox:latest
    profiles:
      - build-only           # Prevents automatic startup; image is pre-built only
    networks: []             # No network by default; overridden per-run in Phase 6

volumes:
  postgres_data:
    driver: local
  workspaces:
    driver: local

networks:
  aie_network:
    driver: bridge
